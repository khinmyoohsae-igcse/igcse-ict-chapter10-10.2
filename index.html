      currentQuizState = originalQuizData.map((item) => {
        const shuffledOptions = [...item.options];
        shuffleArray(shuffledOptions);
        return {
          ...item,
          shuffledOptions: shuffledOptions
        };
      });
      userAnswers = new Array(originalQuizData.length).fill(null);
      renderQuiz();
      calculateScore();
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      currentQuizState.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'mcq-card';
        card.id = `card-${index}`;

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerText = item.q;
        card.appendChild(title);

        const optionsList = document.createElement('div');
        optionsList.className = 'options';

        item.shuffledOptions.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;
          
          if (userAnswers[index] === optText) {
            if (optText === item.answerText) {
              btn.classList.add('selected-correct');
            } else {
              btn.classList.add('selected-incorrect');
            }
          }

          btn.onclick = () => handleAnswerSelect(index, optText);
          optionsList.appendChild(btn);
        });

        card.appendChild(optionsList);

        const exp = document.createElement('div');
        exp.className = `explanation ${userAnswers[index] !== null ? 'show' : ''}`;
        exp.id = `exp-${index}`;
        exp.innerText = `Explanation: ${item.exp}`;
        card.appendChild(exp);

        container.appendChild(card);
      });
    }

    function handleAnswerSelect(questionIdx, selectedOptText) {
      userAnswers[questionIdx] = selectedOptText;
      const card = document.getElementById(`card-${questionIdx}`);
      const buttons = card.querySelectorAll('.option-btn');
      const item = currentQuizState[questionIdx];

      buttons.forEach(btn => {
        btn.classList.remove('selected-correct', 'selected-incorrect');
        const optionContent = btn.innerText.substring(3);
        if (optionContent === selectedOptText) {
          if (selectedOptText === item.answerText) {
            btn.classList.add('selected-correct');
          } else {
            btn.classList.add('selected-incorrect');
          }
        }
      });

      const expBox = document.getElementById(`exp-${questionIdx}`);
      expBox.classList.add('show');

      calculateScore();
    }

    function calculateScore() {
      let score = 0;
      userAnswers.forEach((ansText, idx) => {
        if (ansText === originalQuizData[idx].answerText) {
          score++;
        }
      });
      document.getElementById('score').innerText = score;
    }

    function shuffleAllAnswers() {
      currentQuizState.forEach((item) => {
        shuffleArray(item.shuffledOptions);
      });
      renderQuiz();
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
